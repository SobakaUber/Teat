<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07070a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>UBER // CONTROL</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Boot intro overlay -->
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro-stage">
      <i class="intro-dot"></i>
      <div class="intro-frame">
        <span class="fx tl"></span><span class="fx tr"></span>
        <span class="fx bl"></span><span class="fx br"></span>
        <div class="intro-est">EST. 2026</div>
        <div class="intro-logo glitch" data-text="UBER">UBER</div>
        <div class="intro-jp">茨を越えて星々へ</div>
      </div>
    </div>
    <div class="intro-skip">TAP TO SKIP</div>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-glyph">◣</span>
      <h1>UBER<span class="accent">//</span>CONTROL</h1>
    </div>
    <div class="meta">
      <span class="stat" id="stat-running">— online</span>
      <span class="dot-sep">/</span>
      <span class="stat" id="stat-total">— units</span>
      <button id="refresh" class="refresh" title="Обновить">⟳</button>
    </div>
  </header>

  <main>
    <div id="error" class="error hidden"></div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden">НЕТ КОНТЕЙНЕРОВ ДЛЯ ОТОБРАЖЕНИЯ</div>
  </main>

  <footer class="footer">
    <span id="updated">подключение…</span>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
