<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Container Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-glyph">▚</span>
      <h1>CONTAINER<span class="accent">_</span>DASHBOARD</h1>
    </div>
    <div class="meta">
      <span class="stat" id="stat-running">— running</span>
      <span class="dot-sep">/</span>
      <span class="stat" id="stat-total">— total</span>
      <button id="refresh" class="refresh" title="Обновить">⟳</button>
    </div>
  </header>

  <main>
    <div id="error" class="error hidden"></div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden">Нет контейнеров для отображения.</div>
  </main>

  <footer class="footer">
    <span id="updated">подключение…</span>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
